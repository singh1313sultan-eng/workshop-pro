# Render blueprint – one web service running the Docker image, data in Supabase.
services:
  - type: web
    name: workshop-pro
    runtime: docker
    region: singapore          # closest Render region to Australia
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD     # first administrator sign-in; must be changed at first sign-in
        sync: false
      - key: PUBLIC_URL         # e.g. https://service.yourworkshop.com.au
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: TZ
        value: Australia/Sydney
      - key: CLICKSEND_USERNAME
        sync: false
      - key: CLICKSEND_API_KEY
        sync: false
      - key: SMS_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
